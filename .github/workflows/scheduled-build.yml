name: Scheduled build with RSS ingest

on:
  schedule:
    # Every hour — adjust to 15–60 min as needed
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Ingest council RSS
        env:
          COUNCIL_RSS_URL: ${{ secrets.COUNCIL_RSS_URL }}
        run: npm run ingest:rss

      - name: Build site
        run: npm run build

      # Deploy step depends on your host — examples:
      # Netlify: npx netlify-cli deploy --prod --dir=dist
      # Cloudflare: npx wrangler pages deploy dist
      - name: Deploy (configure for your host)
        run: echo "Add deploy step for Netlify or Cloudflare Pages"
